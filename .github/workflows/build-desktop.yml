name: Build SKIPI Core Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish release assets to (e.g. v1.0.18). Leave blank to skip release publishing.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Build desktop DLL (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Set up GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Test and build shared library
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++
          go test ./...
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o dist/skipicore.dll ./cmd/skipicore-desktop
          cp desktop/include/skipicore_desktop.h dist/

      - name: Upload desktop library
        uses: actions/upload-artifact@v4
        with:
          name: skipicore-desktop-windows-amd64
          path: dist/
          if-no-files-found: error

  linux-amd64:
    name: Build desktop shared object (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Test and build shared library
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++
          go test ./...
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o dist/libskipicore.so ./cmd/skipicore-desktop
          cp desktop/include/skipicore_desktop.h dist/

      - name: Upload desktop library
        uses: actions/upload-artifact@v4
        with:
          name: skipicore-desktop-linux-amd64
          path: dist/
          if-no-files-found: error

  release:
    name: Release SKIPI Core Desktop
    needs: [windows-amd64, linux-amd64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: skipicore-desktop-windows-amd64
          path: dist-windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: skipicore-desktop-linux-amd64
          path: dist-linux

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          find dist-windows -name "skipicore.dll" -exec cp {} release-assets/ \;
          (cd dist-windows && zip -9 -r ../release-assets/skipicore-windows-amd64.zip .)
          find dist-linux -name "libskipicore.so" -exec cp {} release-assets/ \;
          (cd dist-linux && tar -czvf ../release-assets/skipicore-linux-amd64.tar.gz .)
          (cd release-assets && sha256sum * > sha256sums-desktop.txt)

      - name: Release Desktop Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          files: release-assets/*
