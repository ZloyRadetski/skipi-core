name: Build SKIPI Core Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish release assets to (e.g. v1.0.18). Leave blank to skip release publishing.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Build desktop DLL (Windows x64)
    runs-on: windows-latest
    needs: hev-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Set up GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++
          go test ./...

      # The DLL carries the hev runtime itself (internal/hevpayload), so the host application ships none.
      - name: Download the hev runtime
        uses: actions/download-artifact@v4
        with:
          name: hev-windows
          path: hev-runtime

      - name: Put the hev runtime into the payload
        shell: pwsh
        run: Expand-Archive -Path hev-runtime/hev-windows-x64.zip -DestinationPath internal/hevpayload/payload -Force

      - name: Build shared library
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++
          # Build against the patched xray-core (patches/xray-geodata); fails if a patch no longer applies.
          export GOFLAGS="-modfile=$(go run ./tools/xrayoverlay)"
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o dist/skipicore.dll ./cmd/skipicore-desktop
          cp desktop/include/skipicore_desktop.h dist/

      - name: Upload desktop library
        uses: actions/upload-artifact@v4
        with:
          name: skipicore-desktop-windows-amd64
          path: dist/
          if-no-files-found: error

  linux-amd64:
    name: Build desktop shared object (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build HEV TUN static libraries
        run: bash scripts/build-hev-linux.sh

      - name: Test and build shared library
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++
          # Build against the patched xray-core (patches/xray-geodata); fails if a patch no longer applies.
          export GOFLAGS="-modfile=$(go run ./tools/xrayoverlay)"
          # skipi_hev links the HEV TUN static libraries built above; without it Linux builds use the stub.
          go test -tags skipi_hev ./...
          mkdir -p dist
          go build -tags skipi_hev -buildmode=c-shared -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o dist/libskipicore.so ./cmd/skipicore-desktop
          cp desktop/include/skipicore_desktop.h dist/

      - name: Verify HEV TUN is linked into the library
        run: |
          # The dynamic symbol table survives -s.
          # No `grep -q`: with pipefail, nm getting SIGPIPE from an early-exiting grep fails the check.
          if ! nm -D dist/libskipicore.so | grep ' T hev_socks5_tunnel_main_from_str' >/dev/null; then
            echo "hev_socks5_tunnel_main_from_str is not exported by libskipicore.so" >&2
            exit 1
          fi
          echo "verified: libskipicore.so contains hev_socks5_tunnel_main_from_str"

      - name: Upload desktop library
        uses: actions/upload-artifact@v4
        with:
          name: skipicore-desktop-linux-amd64
          path: dist/
          if-no-files-found: error

  # macOS and Windows run hev as a process of its own (see internal/hevtun). The runtime is built
  # or packaged here and embedded into the Core library, so the app ships and downloads no hev.
  macos:
    name: Build desktop library (macOS)
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      # hev runs as a process of its own on macOS; the library carries it (internal/hevpayload).
      - name: Build hev-socks5-tunnel and put it into the payload
        run: bash scripts/stage-hev-payload.sh macos

      - name: Vet and build shared library
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          # Build against the patched xray-core (patches/xray-geodata); fails if a patch no longer applies.
          export GOFLAGS="-modfile=$(go run ./tools/xrayoverlay)"
          # The tests run on Linux and Windows; here the macOS-only code (hevtun_darwin, netbind) must compile.
          go vet ./...
          arch="$(uname -m)"
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o "dist/libskipicore-macos-$arch.dylib" ./cmd/skipicore-desktop
          cp desktop/include/skipicore_desktop.h dist/

      - name: Upload desktop library
        uses: actions/upload-artifact@v4
        with:
          name: skipicore-desktop-macos
          path: dist/
          if-no-files-found: error

  hev-windows:
    name: Package hev-socks5-tunnel (Windows x64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package hev-socks5-tunnel
        run: bash scripts/package-hev-windows.sh

      - name: Upload hev
        uses: actions/upload-artifact@v4
        with:
          name: hev-windows
          path: build/hev/windows/hev-windows-x64.zip
          if-no-files-found: error

  release:
    name: Release SKIPI Core Desktop
    needs: [windows-amd64, linux-amd64, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: skipicore-desktop-windows-amd64
          path: dist-windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: skipicore-desktop-linux-amd64
          path: dist-linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: skipicore-desktop-macos
          path: dist-macos

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          cp dist-macos/libskipicore-macos-*.dylib release-assets/
          find dist-windows -name "skipicore.dll" -exec cp {} release-assets/ \;
          (cd dist-windows && zip -9 -r ../release-assets/skipicore-windows-amd64.zip .)
          find dist-linux -name "libskipicore.so" -exec cp {} release-assets/ \;
          (cd dist-linux && tar -czvf ../release-assets/skipicore-linux-amd64.tar.gz .)
          (cd release-assets && sha256sum * > sha256sums-desktop.txt)

      - name: Release Desktop Binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
        run: |
          # The AAR workflow creates the same release at the same moment, so creation must
          # tolerate "already exists", and an upload must survive a dropped connection.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes || { sleep 20; gh release view "$TAG" >/dev/null; }
          fi
          for file in release-assets/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Upload of $file failed"; exit 1; fi
              echo "Upload of $file failed (attempt $attempt), retrying"; sleep $((attempt * 10))
            done
          done
