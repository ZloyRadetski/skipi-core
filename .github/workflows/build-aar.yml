name: Build and Release SKIPI Core AAR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install GoMobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build SKIPI Core AAR
        run: |
          gomobile bind -v -target=android -androidapi 24 -javapkg=app.skipi.core -o skipicore.aar .

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skipicore-aar
          path: skipicore.aar

      - name: Release SKIPI Core AAR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: skipicore.aar
          draft: false
          prerelease: false
          generate_release_notes: true
